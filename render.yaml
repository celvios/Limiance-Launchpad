version: "1"

services:
  - type: web
    name: launchpad-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: launchpad-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: BSC_CHAIN_ID
        value: "97"
      - key: BSC_RPC_URL
        value: https://data-seed-prebsc-1-s1.bnbchain.org:8545
      - key: FACTORY_ADDRESS
        value: "0x0000000000000000000000000000000000000000"
      - key: TREASURY_ADDRESS
        value: "0x0000000000000000000000000000000000000000"
      - key: INDEXER_START_BLOCK
        value: "0"
      - key: WHALE_THRESHOLD_USDT
        value: "10"
      - key: TOKEN_CREATION_FEE_USDT
        value: "10"
      - key: PINATA_GATEWAY
        value: https://gateway.pinata.cloud
      - key: SUPPORTED_PAYMENT_ASSETS
        value: "0x0000000000000000000000000000000000000000"
      - key: USDT_ADDRESS
        value: "0x0000000000000000000000000000000000000000"
      - key: PANCAKE_ROUTER_ADDRESS
        value: "0x0000000000000000000000000000000000000000"
      - key: WBNB_ADDRESS
        value: "0x0000000000000000000000000000000000000000"
      - key: PIMLICO_API_KEY
        sync: false
      - key: PIMLICO_BUNDLER_URL
        sync: false
      - key: PIMLICO_PAYMASTER_URL
        sync: false
      - key: PIMLICO_SPONSORSHIP_POLICY_ID
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: INDEXER_SECRET
        generateValue: true

databases:
  - name: launchpad-db
    databaseName: launchpad
    user: launchpad_user
    plan: free
